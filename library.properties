sentence=On-board peripheral access for the ATRONIA SensBlue Monarch (ESP32-WROOM-32E-N8).
paragraph=Provides Arduino-style access to the SensBlue Monarch IoT controller: RGB LED and isolated I/O via the PCAL6416A expander, 0-10V / 4-20mA analog inputs, RS485, BME280 environment sensor, SSD1306 OLED display, AT24C02 EEPROM, Quectel BG95 modem power sequencing, GNSS mux control, and battery state-of-charge estimation. Hardware revision 2.41.
category=Device Control
